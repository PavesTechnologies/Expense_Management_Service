<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Desk · Cash advances and expense claims</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --canvas:#edf0f5;--surface:#ffffff;--sunk:#f3f5f9;--ink:#141d2f;--muted:#566178;--line:#d4dae5;--faint:#e6eaf1;
  --nav:#12203a;--nav2:#1d3156;--navink:#c3cde1;
  --acc:#0a6a72;--acc2:#085860;--accsoft:#d8eef0;--onacc:#ffffff;
  --ok:#15703f;--oksoft:#dbf1e4;--warn:#845000;--warnsoft:#fcebc6;--bad:#a5281f;--badsoft:#fadad6;--info:#2450b5;--infosoft:#e1e9fb;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0d1320;--surface:#151d2e;--sunk:#1b2539;--ink:#e6ebf5;--muted:#9aa6bf;--line:#2b3750;--faint:#222c42;
    --nav:#0a1222;--nav2:#17253f;--navink:#aab6cf;
    --acc:#4fc3cc;--acc2:#7fd6dc;--accsoft:#12393e;--onacc:#06262a;
    --ok:#58c58a;--oksoft:#12301f;--warn:#f0b34a;--warnsoft:#3a2a0a;--bad:#ff8f86;--badsoft:#3c1613;--info:#8fb0ff;--infosoft:#16254a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0d1320;--surface:#151d2e;--sunk:#1b2539;--ink:#e6ebf5;--muted:#9aa6bf;--line:#2b3750;--faint:#222c42;
  --nav:#0a1222;--nav2:#17253f;--navink:#aab6cf;
  --acc:#4fc3cc;--acc2:#7fd6dc;--accsoft:#12393e;--onacc:#06262a;
  --ok:#58c58a;--oksoft:#12301f;--warn:#f0b34a;--warnsoft:#3a2a0a;--bad:#ff8f86;--badsoft:#3c1613;--info:#8fb0ff;--infosoft:#16254a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:22px;line-height:1.25;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
h3{font-size:14px;margin:0 0 6px;font-weight:600}
p{margin:0 0 8px}
small,.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--navink);padding:18px 12px 24px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto}
.brand{padding:4px 10px 16px}
.brand b{display:block;font-size:17px;color:#fff;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--navink)}
.ngrp{margin:14px 10px 4px;font-size:12px;color:#8190ad}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--navink);font-size:14px}
.nv:hover{background:var(--nav2);text-decoration:none;color:#fff}
.nv.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 #5fd0d8}
.bdg{background:#e5b04a;color:#2a1c00;border-radius:10px;font-size:12px;font-weight:600;padding:0 7px;min-width:20px;text-align:center}
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 22px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.who b{display:block;line-height:1.2}.who small{display:block;line-height:1.2}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{padding:22px;max-width:1240px}
.hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.hd p{margin:0;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer;line-height:1.3}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.pri:hover{background:var(--acc2)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad:hover{background:var(--badsoft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.tools select{width:auto;max-width:260px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-weight:500;margin-bottom:3px}
.fld>em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:3px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.panel>h2:first-child,.panel>.ph h2{margin-top:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--faint);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t tr.row:hover td{background:var(--sunk)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.chip{display:inline-block;border-radius:11px;padding:1px 9px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--oksoft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warnsoft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--badsoft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--infosoft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accsoft);color:var(--acc);border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 13px;border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{width:auto}

.banner{border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;background:var(--accsoft);color:var(--ink);border:1px solid transparent}
.banner.warn{background:var(--warnsoft)}.banner.bad{background:var(--badsoft)}.banner.info{background:var(--infosoft)}.banner.ok{background:var(--oksoft)}
.banner b{font-weight:600}
.alert{border-left:3px solid var(--warn);background:var(--warnsoft);padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:10px}
.alert.bad{border-color:var(--bad);background:var(--badsoft)}.alert.ok{border-color:var(--ok);background:var(--oksoft)}.alert.info{border-color:var(--info);background:var(--infosoft)}
.errs{margin:6px 0 10px;padding:0;list-style:none}
.errs li{color:var(--bad);padding:2px 0}.errs li::before{content:"✕  ";font-weight:700}
.warns{margin:6px 0 10px;padding:0;list-style:none}
.warns li{color:var(--warn);padding:2px 0}.warns li::before{content:"!  ";font-weight:700}
.goods li{color:var(--ok)}.goods li::before{content:"✓  ";font-weight:700}
.goods{margin:6px 0 10px;padding:0;list-style:none}

.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.nums>div{padding:11px 14px;border-right:1px solid var(--faint)}
.nums>div:last-child{border-right:0}
.nums small{display:block}
.nums b{font-size:19px;font-weight:600}
.nums b.hot{color:var(--bad)}.nums b.good{color:var(--ok)}

.eq{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:6px 0 14px}
.eq>div{border:1px solid var(--line);padding:10px 14px;background:var(--surface);min-width:150px;flex:1}
.eq>div small{display:block}.eq>div b{font-size:20px;font-weight:600}
.eq .op{flex:0 0 auto;min-width:0;border:0;background:none;display:grid;place-items:center;font-size:20px;color:var(--muted);padding:0 8px}
.eq .res{background:var(--accsoft);border-color:transparent}
.eq .res.zero{background:var(--oksoft)}
.eq .res.neg{background:var(--warnsoft)}

.steps{display:flex;gap:0;margin:4px 0 16px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:8px 12px 8px 22px;position:relative;border-top:3px solid var(--line);background:var(--surface);border-left:1px solid var(--faint);font-size:13px}
.step b{display:block;font-weight:600}
.step.done{border-top-color:var(--ok)}.step.cur{border-top-color:var(--acc);background:var(--accsoft)}.step.stop{border-top-color:var(--bad)}
.step.done b::before{content:"✓ ";color:var(--ok)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--faint)}
.tl li{position:relative;padding:0 0 12px 14px}
.tl li::before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--acc)}
.tl small{display:block}

.modal-back{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 30px) 14px 30px;overflow:auto}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:860px}
.mh{padding:16px 20px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mh h2{margin:0}
.mb{padding:16px 20px}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:0 0 10px 10px}
.x{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
#toasts{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:99;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.opt.on{border-color:var(--acc);background:var(--accsoft)}
.opt b{display:block;font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--faint)}
.chk:last-child{border-bottom:0}
.bar{height:10px;background:var(--faint);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.w i{background:#d99a2b}.bar.b i{background:var(--bad)}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:4px 0}

/* flow charts */
.fl{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.fl .arr{width:2px;height:16px;background:var(--line);position:relative}
.fl .arr::after{content:"";position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top:7px solid var(--line);border-bottom:0}
.fn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;max-width:320px;text-align:center}
.fn.step b{display:block;font-size:12.5px;color:var(--acc);font-weight:600}
.fn.dec{background:var(--infosoft);border-color:transparent;color:var(--ink);font-weight:500;border-radius:18px;max-width:300px}
.fn.end{border-radius:18px;font-weight:600}
.fn.end.bad{background:var(--badsoft);color:var(--bad);border-color:transparent}.fn.end.ok{background:var(--oksoft);color:var(--ok);border-color:transparent}.fn.end.warn{background:var(--warnsoft);color:var(--warn);border-color:transparent}
.branches{display:flex;gap:18px;align-items:flex-start;justify-content:center;margin-top:0;border-top:2px solid var(--line);padding-top:0;position:relative}
.br{display:flex;flex-direction:column;align-items:center;padding-top:6px;min-width:0}
.brl{font-size:12px;font-weight:600;color:var(--muted);background:var(--canvas);padding:0 6px}
.flowwrap{overflow-x:auto;padding:10px 4px 6px}
.flowwrap .fl{min-width:max-content;margin:0 auto}
.dec+.branches{margin-top:10px}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px;align-items:center}
  .side .brand{padding:0 10px 0 4px;flex:none}.ngrp{display:none}.nv{white-space:nowrap}
  .cols,.cols.even,.g2,.g3,.g4{grid-template-columns:1fr}
  main{padding:14px}
  .top{padding:8px 14px}
  .kv{grid-template-columns:120px minmax(0,1fr)}
  .hbar{grid-template-columns:100px 1fr 80px}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}}

/* ---------- v3 additions ---------- */
.ic{width:18px;height:18px;flex:none}
.nv .nl{display:flex;align-items:center;gap:10px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1aa3ad,#0a6a72);color:#fff;display:grid;place-items:center;flex:none}
.logo .ic{width:19px;height:19px}
.btn.ib{display:inline-flex;gap:6px;align-items:center}
.btn.ib .ic{width:16px;height:16px}
label.btn{display:inline-block;cursor:pointer}
.av.sm{width:22px;height:22px;font-size:10.5px;display:inline-grid;vertical-align:middle;color:#fff;margin-right:4px}
.gs{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:20px;padding:0 12px;flex:1;max-width:340px;min-width:160px}
.gs input{border:0;background:none;padding:7px 0;outline:0}
.gs .ic{color:var(--muted);width:16px;height:16px}
.gs:focus-within{border-color:var(--acc);background:var(--surface)}
.fs{max-width:230px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.kic{width:40px;height:40px;border-radius:10px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;flex:none}
.kpi.warn .kic{background:var(--warnsoft);color:var(--warn)}.kpi.bad .kic{background:var(--badsoft);color:var(--bad)}.kpi.ok .kic{background:var(--oksoft);color:var(--ok)}.kpi.info .kic{background:var(--infosoft);color:var(--info)}
.kpi small{display:block;line-height:1.2}.kpi b{display:block;font-size:20px;font-weight:600;line-height:1.25}.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:24px;background:var(--surface);border-radius:50%}
.donut span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-weight:600;font-size:13px;text-align:center}
.lg{list-style:none;margin:0;padding:0;flex:1;min-width:170px}
.lg li{display:flex;align-items:center;gap:8px;padding:3px 0}
.lg li span{flex:1}.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.wrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--faint)}
.wrow:last-child{border-bottom:0}.wrow>div{flex:1;min-width:0}.wrow small{display:block;color:var(--muted)}
.wic{width:34px;height:34px;border-radius:8px;background:var(--sunk);color:var(--acc);display:grid;place-items:center;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--muted);padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accsoft);color:var(--acc);font-weight:600}
.seg .ic{width:15px;height:15px}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.plain{list-style:none;margin:0 0 8px;padding:0}.plain li{padding:4px 0}
.tl li.cm::before{background:var(--acc)}
.tl li.cm b{font-weight:500}
.cmbox{display:flex;gap:8px;margin-top:10px}.cmbox input{flex:1}
.bva{margin-bottom:10px}.bvh{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.bvh span{color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
.rcpt{font:inherit;text-align:left;background:#fffdf6;color:#1b2233;border:1px solid #d8d2bd;border-radius:4px 4px 10px 10px;padding:12px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 #e7e1cb;transition:transform .12s}
.rcpt:hover{transform:translateY(-2px)}
.rcpt small{color:#6b6a5e}.rcpt em{font-style:normal;color:#6b6a5e}.rcpt strong{font-size:18px}
.rcpt .dots{border-top:2px dotted #c9c3ab;margin:4px 0}
.tools .ib{padding:4px 9px}
.panel>.hd{margin-bottom:8px}
.t tr.row td:first-child{box-shadow:inset 3px 0 0 transparent}
.t tr.row:hover td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
@media (max-width:960px){.gs{order:3;max-width:none;flex-basis:100%}.stick{position:static}.donut-wrap{justify-content:center}}

</style>

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Expense Desk prototype — core data + business rules
   ===================================================================== */
const KEY = 'expense-desk-proto-v3';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATS = ['Airfare','Train / bus','Local travel','Lodging','Meals','Client entertainment','Fuel / toll','Communication','Miscellaneous'];
const ROLE_LABEL = {employee:'Employee',manager:'Manager · first-level approver',depthead:'Department head · second-level approver',finance:'Finance executive',controller:'Finance controller',payroll:'Payroll officer',admin:'System admin'};
const ROLE_SHORT = {employee:'Employee',manager:'Manager',depthead:'Dept head',finance:'Finance',controller:'Controller',payroll:'Payroll',admin:'Admin'};
const POLICY0 = {
  denom:500, minAdv:500, cap:{G1:30000,G2:50000,G3:75000,G4:100000},
  l2Adv:25000, l2Rep:50000, receipt:500, lostMax:2000,

const estTotal = est => est ? round2(Object.values(est).reduce((s, v) => s + num(v), 0)) : 0;
const estClean = est => { if (!est || estTotal(est) <= 0) return null; const o = {}; Object.keys(est).forEach(k => o[k] = num(est[k])); return o; };
const estText = est => Object.entries(est).filter(([k, v]) => num(v) > 0).map(([k, v]) => k + ' ' + inr(num(v))).join(' · ');
function lineAmount(l) { const p = S.policy, t = l.type || 'Expense'; return round2(t === 'Mileage' ? num(l.km) * p.mileage : t === 'Per diem' ? num(l.days) * p.perDiem : num(l.amt) * (p.fx[l.cur] || 1)); }
const GROUP = cat => ['Airfare', 'Train / bus', 'Local travel', 'Fuel / toll'].includes(cat) ? 'Travel' : cat === 'Lodging' ? 'Lodging' : ['Meals', 'Client entertainment'].includes(cat) ? 'Meals' : 'Other';
function budgetVsActual(er) {
  const advs = (er.advIds || []).map(A).filter(a => a && a.est); if (!advs.length) return [];
  const est = {Travel:0, Lodging:0, Meals:0, Other:0}, act = {Travel:0, Lodging:0, Meals:0, Other:0};
  advs.forEach(a => Object.keys(est).forEach(k => est[k] += num(a.est[k])));
  er.lines.filter(l => l.st !== 'rejected').forEach(l => { const g = GROUP(l.cat); act[g] = round2(act[g] + l.inr); });
  return Object.keys(est).map(g => ({g, est:est[g], act:act[g], pct: est[g] ? Math.round((act[g] - est[g]) / est[g] * 100) : (act[g] > 0 ? 100 : 0)}));
}
function auditFlags(er) {
  const f = [], p = S.policy;
  er.lines.filter(l => l.st !== 'rejected').forEach(l => {
    const t = l.type || 'Expense';
    if (l.lost) f.push({sev:'warn', t:'Receipt declared lost for ' + l.merchant + ' (' + inr(l.inr) + ')'});
    if (t === 'Expense' && p.catCap[l.cat] && l.inr > p.catCap[l.cat]) f.push({sev:'warn', t:l.merchant + ' is above the ' + inr(p.catCap[l.cat]) + ' ' + l.cat + ' cap'});
    const dow = l.date ? pd(l.date).getUTCDay() : 1;
    if ((dow === 0 || dow === 6) && t === 'Expense' && ['Meals', 'Client entertainment'].includes(l.cat)) f.push({sev:'info', t:l.cat + ' on a weekend: ' + l.merchant + ', ' + fd(l.date)});
    if (t === 'Expense' && l.inr >= 2000 && l.inr % 1000 === 0 && !l.hasReceipt) f.push({sev:'info', t:'Round amount without a receipt: ' + l.merchant});
  });
  if (er.type === 'Regular' && er.to && er.created && diff(er.created, er.to) > 10) f.push({sev:'info', t:'Submitted ' + diff(er.created, er.to) + ' days after the trip'});
  budgetVsActual(er).forEach(r => { if (r.est > 0 && r.pct > p.estVar) f.push({sev:'warn', t:r.g + ' is ' + r.pct + '% over the trip estimate (' + inr(r.act) + ' against ' + inr(r.est) + ')'}); });
  if (er.type === 'Backdated') f.push({sev:'info', t:'Backdated expense'});
  if (er.l2Override) f.push({sev:'high', t:'Older than the backdate window or above the Controller threshold'});
  const score = f.reduce((s, x) => s + ({high:3, warn:2, info:1}[x.sev]), 0);
  return {flags:f, score, level: score >= 5 ? 'High' : score >= 2 ? 'Medium' : 'Low'};
}

ACT.payErSubmit = id => { const errs = payER(R(id), S.session, ui.m); if (errs.length) { ui.m.errs = errs; render(); return; } done('Payment recorded'); };

/* admin and demo */
ACT.polSave = () => { const p = ui.pol; const n = o => { Object.keys(o).forEach(k => { if (typeof o[k] === 'object') n(o[k]); else o[k] = num(o[k]); }); }; n(p); if (!(p.denom > 0)) { toast('The amount multiple must be greater than zero.'); return; } S.policy = clone(p); toast('Rules saved. They apply to new requests now.'); render(); };
ACT.exitSubmit = id => { startExit(U(id), S.session); done(U(id).name + ' is marked as exiting'); };
ACT.setDate = arg => { ui.m.date = arg; ACT.demoDate(); };
ACT.demoDate = () => { if (!ui.m.date) return; S.date = ui.m.date; done('Date is now ' + fd(S.date)); };
ACT.demoReset = () => { const keep = S.session; seed(); S.session = keep; ui.fAdv = ui.fRep = ui.rev = ui.settle = ui.pol = null; ui.modal = null; ui.m = {}; toast('Demo data reset'); go('home'); render(); };

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'A') e.preventDefault();
  fn(t.dataset.arg, t, e);
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.b) return;
  setp(t.dataset.b, t.type === 'checkbox' ? t.checked : t.value);
  if (t.dataset.live && LIVE[t.dataset.live]) { const box = document.getElementById(t.dataset.live); if (box) box.innerHTML = LIVE[t.dataset.live](); saveState(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.chg && CHG[t.dataset.chg]) { if (t.dataset.b) setp(t.dataset.b, t.value); CHG[t.dataset.chg](t.value); return; }
  if (t.dataset && t.dataset.file) { const f = t.files && t.files[0]; if (f) { setp(t.dataset.file, f.name); if (t.dataset.file.endsWith('.receiptName')) setp(t.dataset.file.replace('.receiptName', '.hasReceipt'), true); render(); } return; }
  if (t.dataset && t.dataset.b) {
    setp(t.dataset.b, t.type === 'checkbox' ? t.checked : t.value);
    if (t.dataset.r) render();
    else if (t.dataset.live && LIVE[t.dataset.live]) { const box = document.getElementById(t.dataset.live); if (box) box.innerHTML = LIVE[t.dataset.live](); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'gsearch') { ui.q = e.target.value; go('search'); route_(); } });
window.addEventListener('hashchange', route_);

/* ---------- init ---------- */
function init() {
  S = loadState();
  if (!S) { seed(); }
  if (!location.hash) location.hash = '#home';
  route_();
}
document.addEventListener('DOMContentLoaded', init);


</script>

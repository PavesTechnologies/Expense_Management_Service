spring.application.name=expense-management-service

# ==========================================================
# UMS Integration
# ==========================================================
ums.base-url=${UMS_BASE_URL}
ums.jwks-uri=${UMS_JWKS_URI}

# ==========================================================
# Spring Security OAuth2 Resource Server
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${UMS_ISSUER_URI}

# ==========================================================
# MySQL Database
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# Hikari Connection Pool
# ==========================================================
spring.datasource.hikari.pool-name=ExpenseManagementPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Pagination
# ==========================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ==========================================================
# Exchange Rate Refresh Scheduler (EP01-S3)
# ==========================================================
# Cron expression for the daily automated exchange-rate refresh job. Default: 02:00 server time.
exchange-rate.refresh.cron=0 0 2 * * *

# ==========================================================
# Actuator
# ==========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ==========================================================
# Springdoc / Swagger
# ==========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================================
# Logging
# ==========================================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.expense_management_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# ==========================================================
# Exchange Rate Configuration
# ==========================================================

exchange.rate.api.url=${EXCHANGE_RATE_API_URL}
exchange.rate.api.key=${EXCHANGE_RATE_API_KEY}
exchange.rate.base-currency=${EXCHANGE_RATE_BASE_CURRENCY}
exchange.rate.refresh.cron=${EXCHANGE_RATE_REFRESH_CRON}

# ==========================================================
# Employee CDC Pipeline (EP06 Phase 0)
# ==========================================================
# Local dev default targets the throwaway Redpanda in docker-compose.cdc.yml
# (see docs/cdc/README.md). Override via KAFKA_BOOTSTRAP_SERVERS in real
# environments once the Debezium connector and cdc-network are provisioned.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.group-id=xms-employee-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Topic name follows the Debezium <server.name>.<schema>.<table> convention.
# "eos_dev" is a proposed dev connector server name (see Phase 0c handoff doc) -
# deliberately NOT the "eos_test" topic the Leave Management System already
# consumes, so this service's consumer group cannot interfere with LMS's.
cdc.employee.topic=${CDC_EMPLOYEE_TOPIC:eos_dev.eos.employee_details}

# Cadence for replaying quarantined CDC events from cdc_failure_log. Default: every 10 minutes.
cdc.retry.cron=0 */10 * * * *

spring.application.name=expense-management-service


# ==========================================================
# UMS Integration
# ==========================================================
ums.base-url=${UMS_BASE_URL}
ums.jwks-uri=${UMS_JWKS_URI}

# ==========================================================
# Employee Onboarding Integration (Department master data — EP01-S4)
# ==========================================================
employee-onboarding.base-url=${EMPLOYEE_ONBOARDING_BASE_URL}

# ==========================================================
# PMS Integration (Client-Billable Expenses — Epic 8)
# ==========================================================
# Forwards the caller's own JWT (PMS accepts XMS's GENERAL role) — no service account needed.
# Confirmed value: https://enterpriseappdev.pavestechnologies.net/pms
pms.base-url=${PMS_BASE_URL:https://enterpriseappdev.pavestechnologies.net/pms}

# ==========================================================
# RMS Integration (Client-Billable Expenses — Epic 8)
# ==========================================================
# Forwards the caller's own UMS JWT, like PMS. RMS's client-lookup endpoints only accept
# Admin/Resource_Manager/Project_Manager roles, so other callers get 403 from GET /xms/clients.
rms.base-url=${RMS_BASE_URL}

# ==========================================================
# Spring Security OAuth2 Resource Server
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${UMS_ISSUER_URI}

# ==========================================================
# MySQL Database
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# Hikari Connection Pool
# ==========================================================
spring.datasource.hikari.pool-name=ExpenseManagementPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================
# Flyway
# ==========================================================
spring.flyway.enabled=false

# ==========================================================
# JPA / Hibernate
# ==========================================================
# ddl-auto remains "update" for every table Flyway does not yet own — the `receipt` table
# is the first to be fully migration-managed (see V1__receipt_s3_metadata.sql); ddl-auto
# is a no-op against it once Flyway has already created the columns Hibernate expects.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Pagination
# ==========================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ==========================================================
# Exchange Rate Refresh Scheduler (EP01-S3)
# ==========================================================
# Cron expression for the automated exchange-rate refresh job. Default: hourly. Runs after today's
# rates are recorded make no API calls, so hourly only retries until the day's first successful fetch.
exchange-rate.refresh.cron=0 0 * * * *

# ==========================================================
# Actuator
# ==========================================================
# Frontend origins allowed to call this API (local dev server + the dev site and its CloudFront domain).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://enterpriseappdev.pavestechnologies.net,https://d15j2ej3bear0q.cloudfront.net}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ==========================================================
# Springdoc / Swagger
# ==========================================================
# Served under /xms like every controller, since the ingress only routes /xms/** to XMS
# (no servlet context path is set). UI: /xms/swagger-ui.html
springdoc.swagger-ui.path=/xms/swagger-ui.html
springdoc.api-docs.path=/xms/v3/api-docs
# Behind the ingress/CloudFront: honour X-Forwarded-* so Swagger's "Try it out" uses the
# public scheme and host instead of the pod's http://<pod-ip>:8080.
server.forward-headers-strategy=framework

# ==========================================================
# Logging
# ==========================================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.expense_management_service=DEBUG
# SQL statements and bound parameter values (which include PII/financial data) are not logged.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
# ==========================================================
# Amazon S3 (Receipt storage)
# ==========================================================
aws.region=${AWS_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.bucket-name=${AWS_S3_BUCKET}

# ==========================================================
# Receipt Upload (EP02-S3)
# ==========================================================
receipt.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Minutes a pre-signed view/download URL stays valid for.
receipt.presigned-url-ttl-minutes=15

# ==========================================================
# Expense Report (EP02-S1)
# ==========================================================
# Minimum length of the mandatory business purpose free-text field.
expense-report.business-purpose.min-length=10

# ==========================================================
# Exchange Rate Configuration
# ==========================================================

exchange.rate.api.url=${EXCHANGE_RATE_API_URL}
exchange.rate.api.key=${EXCHANGE_RATE_API_KEY}
exchange.rate.base-currency=${EXCHANGE_RATE_BASE_CURRENCY}
exchange.rate.refresh.cron=${EXCHANGE_RATE_REFRESH_CRON}

# ==========================================================
# Employee CDC Pipeline (EP06 Phase 0)
# ==========================================================
# Local dev default targets the throwaway Redpanda in docker-compose.cdc.yml
# (see docs/cdc/README.md). Override via KAFKA_BOOTSTRAP_SERVERS in real
# environments once the Debezium connector and cdc-network are provisioned.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.group-id=xms-employee-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Topic name follows the Debezium <server.name>.<schema>.<table> convention.
# "eos_dev" is a proposed dev connector server name (see Phase 0c handoff doc) -
# deliberately NOT the "eos_test" topic the Leave Management System already
# consumes, so this service's consumer group cannot interfere with LMS's.
cdc.employee.topic=${CDC_EMPLOYEE_TOPIC:eos_dev.eos.employee_details}

# Cadence for replaying quarantined CDC events from cdc_failure_log. Default: every 10 minutes.
cdc.retry.cron=0 */10 * * * *

# ==========================================================
# Delegation of Approval Authority (EP06 Phase 3)
# ==========================================================
# Default approver employeeId used when ApproverResolver cannot otherwise resolve a level
# (ROLE type, or MANAGER/COST_CENTER_OWNER with no data on file). Read via SystemConfiguration
# key "approval.default-approver-employee-id" instead - this property intentionally does not
# exist, since that value belongs in DB-managed config, not a deployment property file.

# Gates the "delegate must hold equal or greater approval authority than the delegator" rule.
# Defaults to disabled - there is no role-ranking data source to enforce it against yet
# (RoleConstants has no hierarchy; no UMS endpoint resolves an arbitrary employeeId's role).
delegation.authority-check.enabled=false

# ==========================================================
# Escalation on SLA Breach (EP06 Phase 4 / BR-12)
# ==========================================================
# SLA duration (business days) is configured per SystemConfiguration key
# "approval.sla.business-days" (default 3 - see SlaPolicyServiceImpl), not here - that value
# belongs in DB-managed config since finance/admin may need to tune it without a deployment.

# Cron expression for the SLA escalation sweep. Default: top of every hour.
escalation.sla.cron=0 0 * * * *

# ==========================================================
# Expense Policy & Compliance (EP05)
# ==========================================================
# Minimum length of an employee's justification note on a policy violation. EP05 is
# advisory-only - this never blocks a save or submission, it only gates whether a
# justification is accepted as substantive enough to record.
policy.justification.min-length=20

# ==========================================================
# Receipt OCR (EP03-S3)
# ==========================================================
# Minimum OCR confidence (0.00-1.00) below which extracted fields are flagged for
# employee review on the Manual Entry screen. Advisory only - never blocks saving.
ocr.confidence-threshold=0.80

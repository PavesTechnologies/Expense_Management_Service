spring.application.name=expense-management-service

# ==========================================================
# UMS Integration
# ==========================================================
ums.base-url=${UMS_BASE_URL}
ums.jwks-uri=${UMS_JWKS_URI}

# ==========================================================
# Spring Security OAuth2 Resource Server
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${UMS_ISSUER_URI}

# ==========================================================
# MySQL Database
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# Hikari Connection Pool
# ==========================================================
spring.datasource.hikari.pool-name=ExpenseManagementPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Actuator
# ==========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ==========================================================
# Springdoc / Swagger
# ==========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================================
# Logging
# ==========================================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.expense_management_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
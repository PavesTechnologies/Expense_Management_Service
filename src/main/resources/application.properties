spring.application.name=expense-management-service

# ==========================================================
# UMS Integration
# ==========================================================
ums.base-url=${UMS_BASE_URL}
ums.jwks-uri=${UMS_JWKS_URI}

# ==========================================================
# Employee Onboarding Integration (Department master data — EP01-S4)
# ==========================================================
employee-onboarding.base-url=${EMPLOYEE_ONBOARDING_BASE_URL}

# ==========================================================
# Spring Security OAuth2 Resource Server
# ==========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${UMS_ISSUER_URI}

# ==========================================================
# MySQL Database
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# Hikari Connection Pool
# ==========================================================
spring.datasource.hikari.pool-name=ExpenseManagementPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================
# Flyway
# ==========================================================
# Every table before the `receipt` S3 rework (V1) was created ad hoc by
# hibernate.ddl-auto=update, so no earlier migration history exists. baseline-on-migrate
# lets Flyway adopt that pre-existing schema as an already-applied baseline instead of
# refusing to run against a non-empty, unversioned database.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ==========================================================
# JPA / Hibernate
# ==========================================================
# ddl-auto remains "update" for every table Flyway does not yet own — the `receipt` table
# is the first to be fully migration-managed (see V1__receipt_s3_metadata.sql); ddl-auto
# is a no-op against it once Flyway has already created the columns Hibernate expects.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Pagination
# ==========================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ==========================================================
# Exchange Rate Refresh Scheduler (EP01-S3)
# ==========================================================
# Cron expression for the daily automated exchange-rate refresh job. Default: 02:00 server time.
exchange-rate.refresh.cron=0 0 2 * * *

# ==========================================================
# Actuator
# ==========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ==========================================================
# Springdoc / Swagger
# ==========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================================
# Logging
# ==========================================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.expense_management_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# ==========================================================
# Amazon S3 (Receipt storage)
# ==========================================================
aws.region=${AWS_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.bucket-name=${AWS_S3_BUCKET}

# ==========================================================
# Receipt Upload (EP02-S3)
# ==========================================================
receipt.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Minutes a pre-signed view/download URL stays valid for.
receipt.presigned-url-ttl-minutes=15

# ==========================================================
# Expense Report (EP02-S1)
# ==========================================================
# Minimum length of the mandatory business purpose free-text field.
expense-report.business-purpose.min-length=10

# ==========================================================
# Exchange Rate Configuration
# ==========================================================

exchange.rate.api.url=${EXCHANGE_RATE_API_URL}
exchange.rate.api.key=${EXCHANGE_RATE_API_KEY}
exchange.rate.base-currency=${EXCHANGE_RATE_BASE_CURRENCY}
exchange.rate.refresh.cron=${EXCHANGE_RATE_REFRESH_CRON}
